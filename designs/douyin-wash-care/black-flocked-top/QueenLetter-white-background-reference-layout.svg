<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="1099" viewBox="0 0 1284 1099"><title>QueenLetter 植绒上衣洗护说明——参考双栏版，白色背景</title>
<rect width="1284" height="1099" fill="#ffffff"/>
<g font-family="Noto Serif CJK SC, Songti SC, SimSun,serif">
<rect x="60" y="30" width="1164" height="137" rx="39" fill="#F5EBE4"/>
<circle cx="192" cy="99" r="45" fill="#A27759"/>
<text x="192" y="122" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-weight="700" font-size="59" fill="#ffffff">!</text>
<path d="M274 62V136" stroke="#BEAB9B" stroke-width="2"/>
<text x="307" y="119" font-size="51" fill="#684229" font-weight="600">请单独洗涤，勿与其他黑色衣物混洗</text>
</g>
<g stroke="#2F2926" fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
<circle cx="136" cy="293" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(136 293) scale(1.52)"><rect x="-21" y="-26" width="42" height="52" rx="2"/><path d="M-12 -11H12 M-12 0H12 M-12 10H2"/></g><circle cx="752" cy="293" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(752 293) scale(1.52)"><path d="M-28 -6L-21 25H21L28 -6"/><path d="M-22 4Q-14 -1 -5 4T13 4T23 4"/><path d="M-7 7L-1 -6L6 -9L15 -18L22 -19M-3 13L5 2 M3 17L12 7M10 17L18 10"/></g><circle cx="136" cy="527" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(136 527) scale(1.52)"><path d="M-31 -14L-20 -22L-12 -17H-6L0 -22L12 -13L5 -2L5 24H-24V-2L-31 -8Z"/><path d="M0 -22Q-6 -11 -12 -17"/><path d="M3 -17L16 -23L28 -15L35 -6L26 1L26 25H9V-3" fill="#99755F" stroke="#99755F"/></g><circle cx="752" cy="527" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(752 527) scale(1.52)"><path d="M-28 -9L-23 23H23L29 -9"/><path d="M-23 3Q-15 -4 -7 3T9 3T25 3 M-21 12Q-13 5 -5 12T11 12T24 12"/><path d="M-33 -30L33 30" stroke-width="3.7"/></g><circle cx="136" cy="761" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(136 761) scale(1.52)"><path d="M-23 8L-7 -16L8 -12L14 -1L4 17L-9 27L-24 17Z"/><path d="M-6 -19L8 -25L19 -15L24 -5L12 6M-17 8L-9 18M-12 1L-3 12"/><path d="M-31 -30L31 30" stroke-width="3.8"/></g><circle cx="752" cy="761" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(752 761) scale(1.52)"><path d="M-25 -10L-8 -23L-2 -17H4L10 -23L27 -9L19 1L15 -4V23H-16V-4L-21 0Z"/><path d="M19 -4Q28 -7 33 -2 M19 6Q29 2 35 7M19 16Q29 12 35 17" stroke-linecap="round"/></g><circle cx="136" cy="1000" r="76" fill="#F7F0EB" stroke="none"/><g transform="translate(136 1000) scale(1.52)"><path d="M-27 16Q-24 -5 0 -12H20V15H-27Z"/><path d="M0 -12V-22H22V-12M-21 8H17"/><circle cx="3" cy="5" r="2.5" fill="#262626" stroke="none"/><path d="M-32 -30L29 31" stroke-width="3.8"/></g></g><g font-family="Noto Serif CJK SC, Songti SC, SimSun,serif"><text x="248" y="267" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">01</text><text x="328" y="267" font-size="30" font-weight="650" fill="#241F1D">以实物洗标为准</text><text x="253" y="319" font-size="26" fill="#817E7A">具体洗涤方式</text><text x="253" y="357" font-size="26" fill="#817E7A">请参考衣物内侧洗标。</text><text x="869" y="267" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">02</text><text x="949" y="267" font-size="28" font-weight="650" fill="#241F1D">建议冷水轻柔清洗</text><text x="874" y="319" font-size="26" fill="#817E7A">使用中性洗涤剂，</text><text x="874" y="357" font-size="26" fill="#817E7A">轻柔手洗，尽量反面清洗。</text><text x="248" y="502" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">03</text><text x="328" y="502" font-size="30" font-weight="650" fill="#241F1D">深浅色分开洗</text><text x="253" y="554" font-size="26" fill="#817E7A">深浅色衣物分开洗涤，</text><text x="253" y="592" font-size="26" fill="#817E7A">避免染色。</text><text x="869" y="502" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">04</text><text x="949" y="502" font-size="30" font-weight="650" fill="#241F1D">勿长时间浸泡</text><text x="874" y="554" font-size="26" fill="#817E7A">请勿长时间浸泡，</text><text x="874" y="592" font-size="26" fill="#817E7A">以免影响植绒质感。</text><text x="248" y="738" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">05</text><text x="328" y="738" font-size="27" font-weight="650" fill="#241F1D">勿大力揉搓植绒表面</text><text x="253" y="790" font-size="26" fill="#817E7A">避免用力搓揉、刷洗，</text><text x="253" y="828" font-size="26" fill="#817E7A">以防植绒脱落或受损。</text><text x="869" y="738" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">06</text><text x="949" y="738" font-size="30" font-weight="650" fill="#241F1D">阴凉通风处晾干</text><text x="874" y="790" font-size="26" fill="#817E7A">洗后整理平整，</text><text x="874" y="828" font-size="26" fill="#817E7A">置于阴凉通风处自然晾干，</text><text x="874" y="866" font-size="26" fill="#817E7A">避免暴晒。</text><text x="248" y="976" font-size="41" font-weight="600" font-style="italic" fill="#8D6249">07</text><text x="328" y="976" font-size="27" font-weight="650" fill="#241F1D">熨烫时避免直接接触绒面</text><text x="253" y="1028" font-size="26" fill="#817E7A">如需熨烫，请使用低温隔布熨烫，</text><text x="253" y="1066" font-size="26" fill="#817E7A">避免直接接触植绒表面。</text></g><g stroke="#E9DDD6" stroke-width="1.4">
<path d="M60 406H617 M667 406H1225 M60 641H617 M667 641H1225 M60 886H1225"/>
<path d="M642 225V377 M642 460V610 M642 692V858" />
</g></svg>