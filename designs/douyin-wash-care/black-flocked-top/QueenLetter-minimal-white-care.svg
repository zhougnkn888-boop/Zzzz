<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<title>QueenLetter 黑色植绒上衣简约白底洗护说明</title>
<rect width="1200" height="1600" fill="#FFFFFF"/>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
<text x="96" y="136" font-family="Georgia,'Times New Roman',serif" font-size="59" letter-spacing="1.3">QueenLetter</text>
<line x1="96" y1="185" x2="1104" y2="185" stroke="#D8D8D8" stroke-width="2"/>
<rect x="96" y="218" width="1008" height="159" rx="12" fill="#FBFBFB" stroke="#E8E8E8" stroke-width="1.5"/>
<rect x="96" y="218" width="6" height="159" fill="#242424"/>
<circle cx="151" cy="274" r="21" fill="none" stroke="#323232" stroke-width="2.5"/>
<text x="151" y="286" font-size="34" text-anchor="middle" font-weight="650">!</text>
<text x="201" y="286" font-size="46" font-weight="700">请单独洗涤</text>
<text x="201" y="339" font-size="31" fill="#505050">请勿与其他黑色衣物混洗，避免串色</text>
<text x="101" y="472" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">01</text>
<text x="185" y="471" font-size="39" font-weight="600">以洗标为准</text>
<text x="185" y="522" font-size="28" fill="#626262">实际清洗方式请以衣物内侧洗标为准</text>
<line x1="96" y1="555" x2="1104" y2="555" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="101" y="623" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">02</text>
<text x="185" y="622" font-size="39" font-weight="600">单件单洗</text>
<text x="185" y="673" font-size="28" fill="#626262">不要与其他黑色、深色或浅色衣物混洗</text>
<line x1="96" y1="706" x2="1104" y2="706" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="101" y="774" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">03</text>
<text x="185" y="773" font-size="39" font-weight="600">冷水轻柔</text>
<text x="185" y="824" font-size="28" fill="#626262">如洗标允许水洗，建议冷水翻面轻洗</text>
<line x1="96" y1="857" x2="1104" y2="857" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="101" y="925" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">04</text>
<text x="185" y="924" font-size="39" font-weight="600">保护绒面</text>
<text x="185" y="975" font-size="28" fill="#626262">勿大力揉搓或刷洗植绒表面</text>
<line x1="96" y1="1008" x2="1104" y2="1008" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="101" y="1076" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">05</text>
<text x="185" y="1075" font-size="39" font-weight="600">避免久泡</text>
<text x="185" y="1126" font-size="28" fill="#626262">勿长时间浸泡，不使用漂白剂</text>
<line x1="96" y1="1159" x2="1104" y2="1159" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="101" y="1227" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#858585">06</text>
<text x="185" y="1226" font-size="39" font-weight="600">阴凉晾干</text>
<text x="185" y="1277" font-size="28" fill="#626262">避免暴晒；熨烫时勿直接接触绒面</text>
<line x1="96" y1="1310" x2="1104" y2="1310" stroke="#E8E8E8" stroke-width="1.5"/>
<text x="96" y="1404" font-size="29" fill="#333333" font-weight="600">温馨提醒</text>
<text x="96" y="1458" font-size="27" fill="#666666">浅色拼接下摆请避免与湿润的黑色衣身长时间贴合。</text>
<text x="96" y="1503" font-size="27" fill="#666666">如出现明显染色或串色，请及时联系客服处理。</text>
</g></svg>