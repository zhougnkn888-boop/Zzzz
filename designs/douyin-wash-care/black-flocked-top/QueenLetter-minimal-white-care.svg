<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<title>QueenLetter 黑色植绒上衣简约白底洗护说明 - 图标版</title>
<rect width="1200" height="1600" fill="#ffffff"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#262626">
<!-- brand only; no large guide title -->
<text x="96" y="136" font-family="Georgia,Times New Roman,serif" font-size="59" letter-spacing="1.3">QueenLetter</text>
<line x1="96" y1="185" x2="1104" y2="185" stroke="#D8D8D8" stroke-width="2" />
<!-- headline warning -->
<rect x="96" y="218" width="1008" height="159" rx="12" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="1.5"/>
<rect x="96" y="218" width="6" height="159" fill="#2B2B2B"/>
<circle cx="150" cy="272" r="22" stroke="#555" stroke-width="2.7" fill="none"/>
<text x="150" y="285" text-anchor="middle" font-size="36" font-weight="650">!</text>
<text x="199" y="285" font-size="46" font-weight="700">请单独洗涤</text>
<text x="199" y="339" font-size="31" fill="#545454">请勿与其他黑色衣物混洗，避免串色</text>
<circle cx="143" cy="482" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,482)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -27 H15 L25 -17 V26 H-20 Z"/><path d="M15 -27 V-17 H25"/><path d="M-10 -6 H13 M-10 5 H13 M-10 16 H4"/></g>
<text x="215" y="471" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">01</text>
<text x="279" y="470" font-size="39" font-weight="600">以洗标为准</text>
<text x="279" y="520" font-size="28" fill="#626262">实际清洗方式请以衣物内侧洗标为准</text>
<line x1="96" y1="554" x2="1104" y2="554" stroke="#EAEAEA" stroke-width="1.5"/>
<circle cx="143" cy="633" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,633)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-29 -15 L-18 -23 L-10 -18 L-3 -18 L5 -23 L16 -15 L23 -2 L12 4 L12 24 H-19 V4 L-29 -2 Z"/><path d="M-3 -18 Q-2 -8 5 -18"/><path d="M25 -24 V-11 M25 -4 V6 M25 13 V25" stroke-dasharray="0"/></g>
<text x="215" y="622" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">02</text>
<text x="279" y="621" font-size="39" font-weight="600">单件单洗</text>
<text x="279" y="671" font-size="28" fill="#626262">不要与其他黑色、深色或浅色衣物混洗</text>
<line x1="96" y1="705" x2="1104" y2="705" stroke="#EAEAEA" stroke-width="1.5"/>
<circle cx="143" cy="784" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,784)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-27 -1 L-22 24 H22 L27 -1"/><path d="M-26 -10 Q-18 -17 -10 -10 T6 -10 T24 -10"/><path d="M-22 7 Q-14 1 -6 7 T10 7 T22 7"/><path d="M-2 -29 V-16 M-8 -23 H4 M-7 -28 L3 -18 M3 -28 L-7 -18"/></g>
<text x="215" y="773" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">03</text>
<text x="279" y="772" font-size="39" font-weight="600">冷水轻柔</text>
<text x="279" y="822" font-size="28" fill="#626262">如洗标允许水洗，建议冷水翻面轻洗</text>
<line x1="96" y1="856" x2="1104" y2="856" stroke="#EAEAEA" stroke-width="1.5"/>
<circle cx="143" cy="935" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,935)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-23 13 L-9 -10 L14 3 L0 25 Z"/><path d="M-13 -15 L-2 -29 L22 -13 L12 0"/><path d="M-16 16 L-9 21 M-10 7 L-2 13"/><path d="M-29 -28 L27 28" stroke-width="4"/></g>
<text x="215" y="924" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">04</text>
<text x="279" y="923" font-size="39" font-weight="600">保护绒面</text>
<text x="279" y="973" font-size="28" fill="#626262">勿大力揉搓或刷洗植绒表面</text>
<line x1="96" y1="1007" x2="1104" y2="1007" stroke="#EAEAEA" stroke-width="1.5"/>
<circle cx="143" cy="1086" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,1086)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-27 -3 L-21 24 H21 L27 -3"/><path d="M-21 9 Q-13 3 -5 9 T11 9 T23 9"/><path d="M-21 -4 Q-13 -10 -5 -4 T11 -4 T23 -4"/><path d="M-29 -28 L29 28" stroke-width="4"/></g>
<text x="215" y="1075" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">05</text>
<text x="279" y="1074" font-size="39" font-weight="600">避免久泡</text>
<text x="279" y="1124" font-size="28" fill="#626262">勿长时间浸泡，不使用漂白剂</text>
<line x1="96" y1="1158" x2="1104" y2="1158" stroke="#EAEAEA" stroke-width="1.5"/>
<circle cx="143" cy="1237" r="47" fill="#F7F7F7" stroke="#EDEDED" stroke-width="1.4"/>
<g transform="translate(143,1237)" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-23 -3 L-1 -15 Q-11 -23 -5 -29 Q2 -35 7 -27 Q10 -21 3 -16 L26 -3 L26 4 H-23 Z"/><path d="M-29 16 H9 M-19 25 H20 M16 15 H27" stroke-linecap="round"/></g>
<text x="215" y="1226" font-family="Georgia,'Times New Roman',serif" font-size="31" fill="#929292">06</text>
<text x="279" y="1225" font-size="39" font-weight="600">阴凉晾干</text>
<text x="279" y="1275" font-size="28" fill="#626262">避免暴晒；熨烫时勿直接接触绒面</text>
<line x1="96" y1="1309" x2="1104" y2="1309" stroke="#EAEAEA" stroke-width="1.5"/>
<text x="96" y="1404" font-size="29" font-weight="600">温馨提醒</text>
<text x="96" y="1458" font-size="27" fill="#676767">浅色拼接下摆请避免与湿润的黑色衣身长时间贴合。</text>
<text x="96" y="1503" font-size="27" fill="#676767">如出现明显染色或串色，请及时联系客服处理。</text>
</g>
</svg>